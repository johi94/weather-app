<article class="weather-card container">
  @if (notFound()) {
    <p>La búsqueda no dio ningún resultado.	</p>
  } @else {
    <h2>{{ city() }}</h2>
    @if (weather(); as data) {
      <p>{{ data.current.temperature_2m | number: temperatureFormat }}°C</p>
    } @else {
      <p>Cargando…</p>
    }
  }
</article>
