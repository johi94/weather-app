<header class="header">
  <div class="header__inner container">
    <div class="header__brand">
      <img src="/images/logo.png" alt="Logotipo de WeatherApp" class="header__logo" />
      <form class="header__search" (submit)="search($event)">
        <input
          type="text"
          class="header__search-input"
          placeholder="Buscar ciudad…"
          aria-label="Buscar ciudad"
          [formControl]="query"
        />
        <button type="submit" class="header__search-button" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        @if (invalidInput()) {
          <p class="header__search-hint" role="alert">
            Introduce un nombre de ciudad válido.
          </p>
        }
      </form>
        <p class="header__today">
          <span class="header__city">{{ city() }}</span>
            @if (weather(); as data) {
          <span class="header__range">
            {{ data.daily.temperature_2m_max[0] | number: temperatureFormat }}° /
            {{ data.daily.temperature_2m_min[0] | number: temperatureFormat }}°
          </span>
        }
        </p>
    </div>
  </div>
</header>
